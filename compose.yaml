# Local test only (docker compose up --build). The server runs the image through the
# homelab setup, which publishes no ports and mounts projects/recipe-saver/data at /data.
services:
  app:
    build: .
    platform: linux/arm64
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: qwen2.5:3b
    volumes:
      - ./data/docker:/data
    mem_limit: 1g
