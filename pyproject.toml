[project]
name = "recipe-saver"
version = "0.1.0"
description = "Self-hosted app that turns a shared TikTok link into a saved recipe"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "recipe-scrapers>=15.13.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[curl-cffi]==2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recipe_saver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a running LLM server (LLM_BASE_URL)"]
