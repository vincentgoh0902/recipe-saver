{% set active = jobs|selectattr("active")|list %}
<section id="jobs" class="jobs" {% if active %}hx-get="/jobs" hx-trigger="every 2s" hx-swap="outerHTML"{% endif %}>
  {% for job in jobs %}
  <div class="job {{ job.status }}">
    <div class="job-main">
      <span class="status">{{ job.status }}</span>
      <span class="source">{{ job.url or (job.text[:60] ~ "…") }}</span>
    </div>
    {% if job.error %}<p class="error">{{ job.error }}</p>{% endif %}
    {% if job.status == "failed" %}
    <div class="job-actions">
      <button class="small" hx-post="/jobs/{{ job.id }}/retry" hx-target="#jobs" hx-swap="outerHTML">Retry</button>
      <button class="small quiet" hx-post="/jobs/{{ job.id }}/dismiss" hx-target="#jobs" hx-swap="outerHTML">Dismiss</button>
    </div>
    {% endif %}
  </div>
  {% endfor %}
</section>
